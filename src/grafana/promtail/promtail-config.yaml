# promtail-config.yaml
# Deploy to: /opt/grafana/promtail/promtail-config.yaml
#
# Ships all forensic evidence logs to Loki.
# Each scrape_config maps to a paper plane for dashboard filtering.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /etc/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Gap 2 — Tetragon ZTA violation events (ZeroTrace paper)
  # Tetragon writes JSON-lines to /var/log/tetragon/tetragon.log inside container
  # → mapped to /forensics/tetragon/tetragon.log on host
  - job_name: tetragon
    static_configs:
      - targets: [localhost]
        labels:
          job:   tetragon
          plane: gap2
          paper: zerotrace
          __path__: /forensics/tetragon/tetragon*.log
    pipeline_stages:
      - regex:
          expression: '"function_name"\s*:\s*"(?P<function_name>[^"]+)"'
      - regex:
          expression: '"binary"\s*:\s*"(?P<process_binary>[^"]+)"'
      - labels:
          function_name:
          process_binary:

  # Gap 6 — Zeek network forensics (LegalTrace / ZeroTrace papers)
  # zeekctl writes to current/ (active, uncompressed) then rotates to dated dirs.
  # CompressLogs = 0 must be set in zeekctl.cfg so rotated files stay readable.
  - job_name: zeek
    static_configs:
      - targets: [localhost]
        labels:
          job:   zeek
          plane: gap6
          paper: legaltrace
          __path__: /opt/zeek/spool/zeek/*.log
    pipeline_stages:
      - regex:
          expression: '/opt/zeek/spool/zeek/(?P<log_type>[^.]+)\.log'
          source: filename
      - labels:
          log_type:

  # Gap 6 — RITA behavioral analysis (LegalTrace paper)
  - job_name: rita
    static_configs:
      - targets: [localhost]
        labels:
          job:   rita
          plane: gap6
          paper: legaltrace
          __path__: /forensics/rita/*.json

  # Gap 3 — Volatility memory analysis results (SemBridge paper)
  - job_name: volatility
    static_configs:
      - targets: [localhost]
        labels:
          job:   volatility
          plane: gap3
          paper: sembridge
          __path__: /forensics/memdump/vol_*.json

  # All planes — evidence manifest (cross-paper correlation)
  - job_name: manifest
    static_configs:
      - targets: [localhost]
        labels:
          job:   manifest
          plane: all
          paper: all
          __path__: /forensics/manifest/evidence_manifest.jsonl

  # PCAP rotation log
  - job_name: pcap_capture
    static_configs:
      - targets: [localhost]
        labels:
          job:   pcap_capture
          __path__: /forensics/logs/pcap_capture.log

  # System logs
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job:   system
          __path__: /var/log/syslog
